<!doctype html><meta charset="utf-8"><body style="margin:0">
<iframe id="f" style="width:390px;height:900px;border:0"></iframe><iframe id="g" style="width:1440px;height:900px;border:0"></iframe><pre id="out"></pre>
<script>
const tabs=["home","t1","t3","t2","t5"],out=[];
function check(fr,w){const d=fr.contentDocument,win=fr.contentWindow;
 const broken=[...d.images].filter(i=>i.complete&&i.naturalWidth===0&&i.src&&!i.src.startsWith("data:")).length;
 const small=[...d.querySelectorAll("a,button,select,input,summary")].filter(e=>{const r=e.getBoundingClientRect();return r.width>0&&r.height>0&&e.offsetParent!==null&&(r.height<44&&r.width<44||r.height<32)&&!e.closest(".leaflet-control-attribution")}).map(e=>e.tagName+":"+(e.textContent||e.id).trim().slice(0,12)+":"+Math.round(e.getBoundingClientRect().height));
 const errs=win.__errs||[];
 return {w,overflowPx:d.documentElement.scrollWidth-win.innerWidth,broken,small:small.slice(0,5),errs};}
async function run(){for(const t of tabs){for(const [fr,w] of [[f,390],[g,1440]]){fr.src="index.html?q="+Math.random()+"#"+t;await new Promise(r=>{fr.onload=()=>{fr.contentWindow.__errs=[];fr.contentWindow.addEventListener("error",e=>fr.contentWindow.__errs.push(e.message));setTimeout(r,4000)}});out.push(t+" "+JSON.stringify(check(fr,w)));}}
document.getElementById("out").textContent=out.join("\n");}
run();
</script>
